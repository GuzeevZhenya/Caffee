<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='12' fill='none' stroke='%23d99a4e' stroke-width='2'/%3E%3Ccircle cx='13' cy='10' r='2' fill='%23d99a4e'/%3E%3Ccircle cx='13' cy='17' r='2' fill='%23d99a4e'/%3E%3C/svg%3E">
<title>Блюдо в 3D — Tactile Craft Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/css/style.css">
<style>
  .viewer-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
    gap: var(--sp-6);
    padding: var(--sp-6) 0 var(--sp-8);
    min-height: calc(100dvh - var(--header-h));
  }
  .stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    overflow: hidden;
    min-height: 520px;
    background:
      radial-gradient(50% 60% at 50% 45%, oklch(0.33 0.05 58 / 0.8), transparent 75%),
      var(--bg-2);
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #pins { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3; }
  .pin {
    position: absolute;
    top: 0; left: 0;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }
  .pin.show { opacity: 1; }
  .pin .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px oklch(0.74 0.115 62 / 0.25);
    flex: none;
  }
  .pin .stem { width: 44px; height: 1px; background: var(--accent); flex: none; }
  .pin.left { flex-direction: row-reverse; }
  .pin-card {
    background: oklch(0.24 0.02 58 / 0.92);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.35;
    backdrop-filter: blur(6px);
  }
  .pin-card strong { display: block; font-size: 13px; }
  .pin-card span { color: var(--text-2); font-size: 12px; }

  .stage-toolbar {
    position: absolute;
    left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-4);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    background: oklch(0.24 0.02 58 / 0.85);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    padding: 12px 16px;
    backdrop-filter: blur(8px);
  }
  .stage-toolbar label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    min-width: 80px;
  }
  .mode-toggle { display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; }
  .mode-toggle button {
    border: none;
    background: transparent;
    color: var(--text-2);
    font: 700 12px/1 var(--font-body);
    padding: 8px 14px;
    border-radius: 999px;
    min-height: 36px;
  }
  .mode-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--p-espresso-900); }

  .panel { display: grid; gap: var(--sp-5); align-content: start; }
  .panel h1 { font-size: clamp(24px, 3vw, 34px); }
  .crumb { font-size: 13px; color: var(--text-2); }
  .crumb a { color: var(--text-2); }
  .crumb a:hover { color: var(--accent); }

  .layer-list { display: grid; gap: var(--sp-2); }
  .layer-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: var(--sp-3);
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    background: var(--bg-2);
    transition: border-color 0.18s ease, opacity 0.18s ease;
  }
  .layer-row[data-off="true"] { opacity: 0.45; }
  .layer-row:hover { border-color: var(--accent-deep); }
  .swatch { width: 18px; height: 18px; border-radius: 6px; border: 1px solid oklch(1 0 0 / 0.15); }
  .layer-row .name { font-weight: 700; font-size: 14px; }
  .layer-row .meta { font-size: 12px; color: var(--text-2); }
  .layer-row .mod { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 48px; text-align: right; }
  .switch {
    position: relative;
    width: 44px; height: 24px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    transition: background 0.18s ease, border-color 0.18s ease;
    flex: none;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--text-2);
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--p-espresso-900); }

  .totals {
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    padding: var(--sp-5);
    background: var(--bg-2);
    display: grid;
    gap: var(--sp-4);
  }
  .totals .price-row { display: flex; justify-content: space-between; align-items: baseline; }
  .totals .price { font-size: 30px; }
  .pfc { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); text-align: center; }
  .pfc div { border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 4px; }
  .pfc strong { display: block; font-family: var(--font-display); font-size: 15px; }
  .pfc span { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
  .added-note {
    display: none;
    border: 1px solid var(--ok);
    color: var(--ok);
    border-radius: var(--r-s);
    padding: 10px 14px;
    font-size: 14px;
  }
  .added-note.show { display: block; }

  @media (max-width: 960px) {
    .viewer-layout { grid-template-columns: 1fr; }
    .stage { min-height: 440px; }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="viewer-layout">
    <!-- 3D-сцена -->
    <div class="stage">
      <canvas id="scene" aria-label="3D-модель блюда, перетащите для поворота"></canvas>
      <div id="pins" aria-hidden="true"></div>
      <div class="stage-toolbar">
        <label for="explode">Слои</label>
        <input type="range" id="explode" min="0" max="100" value="100" step="1" aria-label="Разнесение слоёв">
        <div class="mode-toggle" role="group" aria-label="Освещение">
          <button type="button" data-mode="day" aria-pressed="true">День</button>
          <button type="button" data-mode="evening" aria-pressed="false">Вечер</button>
        </div>
      </div>
    </div>

    <!-- Панель кастомизации -->
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</main>

<script type="module">
  import { mountHeader, mountFooter } from "./src/js/ui.js";
  import { getItem, MENU_ITEMS, calculateItemTotals, defaultActiveLayers, fmtPrice } from "./src/js/data.js";
  import { addToCart } from "./src/js/store.js";
  import { initItemScene } from "./src/js/item3d.js";

  mountHeader("Меню");
  mountFooter();

  const params = new URLSearchParams(location.search);
  const item = getItem(params.get("id")) ?? MENU_ITEMS[0];
  const active = new Set(defaultActiveLayers(item));

  // ---------- Панель ----------
  const panel = document.querySelector("#panel");

  function renderPanel() {
    const totals = calculateItemTotals(item, [...active]);
    panel.innerHTML = `
      <p class="crumb"><a href="./menu.html">Меню</a> / ${item.title}</p>
      <h1>${item.title}</h1>
      <p class="muted">${item.short}</p>
      <div class="layer-list" role="group" aria-label="Слои блюда">
        ${item.layers
          .map((l) => {
            const on = active.has(l.id);
            return `
          <div class="layer-row" data-off="${!on}">
            <button type="button" class="switch" role="switch" aria-checked="${on}"
              aria-label="${l.title}: ${on ? "убрать" : "добавить"}" data-layer="${l.id}"></button>
            <div>
              <div class="name">${l.title}${l.isBase ? "" : ' <span class="tag">опция</span>'}</div>
              <div class="meta">${l.grams} г · ${l.kcal} ккал</div>
            </div>
            <span class="mod">${l.priceModifier > 0 ? "+" + fmtPrice(l.priceModifier) : l.isBase ? "база" : "0 ₽"}</span>
            <span class="swatch" style="background:${l.config.colorHex}" aria-hidden="true"></span>
          </div>`;
          })
          .join("")}
      </div>
      <div class="totals">
        <div class="price-row">
          <span class="muted">Итого · ${totals.grams} г</span>
          <span class="price">${fmtPrice(totals.price)}</span>
        </div>
        <div class="pfc">
          <div><strong>${totals.kcal}</strong><span>ккал</span></div>
          <div><strong>${totals.protein}</strong><span>белки</span></div>
          <div><strong>${totals.fat}</strong><span>жиры</span></div>
          <div><strong>${totals.carbs}</strong><span>углев.</span></div>
        </div>
        <button type="button" class="btn btn-primary" id="add">В корзину — ${fmtPrice(totals.price)}</button>
        <p class="added-note" id="added">Добавлено! Можно продолжить настройку или <a href="./checkout.html">перейти к оформлению</a>.</p>
      </div>`;

    panel.querySelectorAll(".switch").forEach((sw) => {
      sw.addEventListener("click", () => {
        const id = sw.dataset.layer;
        if (active.has(id)) active.delete(id);
        else active.add(id);
        scene.setActiveLayers([...active]);
        renderPanel();
      });
    });
    panel.querySelector("#add").addEventListener("click", () => {
      addToCart(item.id, [...active]);
      panel.querySelector("#added").classList.add("show");
    });
  }

  // ---------- Сцена ----------
  const scene = initItemScene(document.querySelector("#scene"), document.querySelector("#pins"), item);

  document.querySelector("#explode").addEventListener("input", (e) => {
    scene.setExplode(Number(e.target.value) / 100);
  });
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      scene.setLighting(btn.dataset.mode);
    });
  });

  scene.setActiveLayers([...active]);
  renderPanel();
</script>
</body>
</html>
