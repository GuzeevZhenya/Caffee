<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='12' fill='none' stroke='%23d99a4e' stroke-width='2'/%3E%3Ccircle cx='13' cy='10' r='2' fill='%23d99a4e'/%3E%3Ccircle cx='13' cy='17' r='2' fill='%23d99a4e'/%3E%3C/svg%3E">
<title>Меню — Tactile Craft Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/css/style.css">
<style>
  .page-head { padding: var(--sp-8) 0 var(--sp-5); }
  .filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-5); }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-5);
    margin-top: var(--sp-6);
    padding-bottom: var(--sp-8);
  }
  .menu-card { display: grid; gap: var(--sp-4); color: var(--text); overflow: hidden; }
  .menu-card:hover { color: var(--text); }
  .menu-visual {
    aspect-ratio: 4 / 3;
    border-radius: var(--r-m);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .menu-visual svg { transition: transform 0.35s ease; }
  .menu-card:hover .menu-visual svg { transform: scale(1.05) translateY(-4px); }
  .menu-visual .tag { position: absolute; top: 12px; left: 12px; background: oklch(0.2 0.02 58 / 0.7); }
  .menu-card h2 { font-size: 19px; }
  .menu-card .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); }
  .menu-card p { color: var(--text-2); font-size: 14px; }
  .menu-card .layers-count { font-size: 13px; color: var(--accent); font-weight: 700; }
  .empty { color: var(--text-2); padding: var(--sp-7) 0; grid-column: 1 / -1; text-align: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Меню</p>
    <h1 class="section-title">Выберите блюдо — и разберите его</h1>
    <p class="section-sub">Каждая карточка ведёт на 3D-страницу, где блюдо раскладывается на слои с граммовкой и КБЖУ.</p>
    <div class="filters" id="filters" role="group" aria-label="Фильтр по категориям"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
  import { mountHeader, mountFooter, initReveal } from "./src/js/ui.js";
  import { CATEGORIES, MENU_ITEMS, calculateItemTotals, defaultActiveLayers, fmtPrice } from "./src/js/data.js";

  mountHeader("Меню");
  mountFooter();

  const grid = document.querySelector("#grid");
  const filters = document.querySelector("#filters");
  let activeCat = "all";

  const cats = [{ id: "all", title: "Всё" }, ...CATEGORIES];
  for (const cat of cats) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = cat.title;
    btn.setAttribute("aria-pressed", String(cat.id === activeCat));
    btn.addEventListener("click", () => {
      activeCat = cat.id;
      filters.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      render();
    });
    filters.append(btn);
  }

  function layerStackSvg(item) {
    // Мини-визуал: слои блюда, разнесённые по вертикали
    const n = item.layers.length;
    const rects = item.layers
      .map((l, i) => {
        const y = 88 - (i * 78) / Math.max(n - 1, 1);
        const w = 44 + l.config.radiusScale * 14;
        const h = 6 + l.config.heightScale * 10;
        return `<rect x="${60 - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="3.5" fill="${l.config.colorHex}" opacity="${l.config.opacity}"/>`;
      })
      .join("");
    return `<svg width="120" height="110" viewBox="0 0 120 110" aria-hidden="true">${rects}</svg>`;
  }

  function render() {
    grid.innerHTML = "";
    const items = MENU_ITEMS.filter((i) => activeCat === "all" || i.category === activeCat);
    if (!items.length) {
      grid.innerHTML = `<p class="empty">В этой категории пока пусто.</p>`;
      return;
    }
    for (const item of items) {
      const totals = calculateItemTotals(item, defaultActiveLayers(item));
      const catTitle = CATEGORIES.find((c) => c.id === item.category)?.title ?? "";
      const el = document.createElement("a");
      el.className = "card menu-card reveal is-in";
      el.href = `./item.html?id=${item.id}`;
      el.innerHTML = `
        <div class="menu-visual" style="background: color-mix(in oklch, ${item.hue} 20%, var(--bg-2))">
          <span class="tag">${catTitle}</span>
          ${layerStackSvg(item)}
        </div>
        <div class="row">
          <h2>${item.title}</h2>
          <span class="price">${fmtPrice(totals.price)}</span>
        </div>
        <p>${item.short}</p>
        <span class="layers-count">${item.layers.length} слоёв · ${totals.kcal} ккал</span>`;
      grid.append(el);
    }
  }

  render();
  initReveal();
</script>
</body>
</html>
