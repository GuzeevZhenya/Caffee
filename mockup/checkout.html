<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='12' fill='none' stroke='%23d99a4e' stroke-width='2'/%3E%3Ccircle cx='13' cy='10' r='2' fill='%23d99a4e'/%3E%3Ccircle cx='13' cy='17' r='2' fill='%23d99a4e'/%3E%3C/svg%3E">
<title>Корзина — Tactile Craft Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/css/style.css">
<style>
  .checkout-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
    gap: var(--sp-6);
    padding: var(--sp-6) 0 var(--sp-8);
    align-items: start;
  }
  .cart-list { display: grid; gap: var(--sp-3); }
  .cart-item {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: var(--sp-4);
    align-items: center;
    padding: var(--sp-4);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    background: var(--bg-2);
  }
  .thumb {
    width: 64px; height: 64px;
    border-radius: var(--r-s);
    display: grid; place-items: center;
  }
  .cart-item h3 { font-size: 16px; }
  .cart-item .custom { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .qty { display: inline-flex; align-items: center; gap: 10px; }
  .qty button {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 16px;
    transition: border-color 0.15s ease;
  }
  .qty button:hover { border-color: var(--accent); }
  .remove {
    background: none; border: none;
    color: var(--text-2); font-size: 12.5px;
    text-decoration: underline;
    padding: 4px;
  }
  .remove:hover { color: var(--busy); }
  .item-line-price { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }

  .summary { display: grid; gap: var(--sp-5); }
  .order-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
  .order-type {
    padding: 12px 8px;
    border-radius: var(--r-s);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-2);
    font: 700 13px/1.3 var(--font-body);
    transition: all 0.15s ease;
    min-height: 48px;
  }
  .order-type:hover { border-color: var(--accent); }
  .order-type[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--p-espresso-900); }
  .order-type[disabled] { opacity: 0.4; cursor: not-allowed; }

  .form-grid { display: grid; gap: var(--sp-4); }
  .sum-row { display: flex; justify-content: space-between; font-size: 14.5px; }
  .sum-row.total { font-size: 18px; font-weight: 800; border-top: 1px solid var(--line); padding-top: var(--sp-3); }
  .sum-row.total span:last-child { font-family: var(--font-display); }

  .empty-cart { text-align: center; padding: var(--sp-9) 0; display: grid; gap: var(--sp-4); justify-items: center; }
  .success {
    border: 1px solid var(--ok);
    border-radius: var(--r-l);
    padding: var(--sp-7);
    text-align: center;
    display: grid;
    gap: var(--sp-3);
    justify-items: center;
    background: oklch(0.78 0.09 160 / 0.06);
  }
  .success .order-no { font-family: var(--font-display); font-size: 30px; color: var(--ok); }

  @media (max-width: 960px) {
    .checkout-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="page-head" style="padding: var(--sp-8) 0 0">
    <p class="eyebrow">Заказ</p>
    <h1 class="section-title">Корзина и оформление</h1>
  </div>
  <div id="root" style="padding-bottom: var(--sp-8)"></div>
</main>

<script type="module">
  import { mountHeader, mountFooter } from "./src/js/ui.js";
  import { getItem, calculateItemTotals, fmtPrice } from "./src/js/data.js";
  import { getCart, updateQty, removeFromCart, clearCart, getMyHold, saveLastOrder } from "./src/js/store.js";

  mountHeader("Корзина");
  mountFooter();

  const root = document.querySelector("#root");
  let orderType = "pickup";

  function cartTotals() {
    let sum = 0;
    for (const c of getCart()) {
      const item = getItem(c.itemId);
      if (!item) continue;
      sum += calculateItemTotals(item, c.activeLayerIds).price * c.qty;
    }
    return sum;
  }

  function render() {
    const cart = getCart();
    if (!cart.length) {
      root.innerHTML = `
        <div class="empty-cart">
          <h2>Корзина пуста</h2>
          <p class="muted">Загляните в меню — там блюда, которые можно разобрать по слоям.</p>
          <a class="btn btn-primary" href="./menu.html">К меню</a>
        </div>`;
      return;
    }

    const hold = getMyHold();
    const sum = cartTotals();
    const deliveryFee = orderType === "delivery" ? (sum >= 800 ? 0 : 150) : 0;

    root.innerHTML = `
      <div class="checkout-layout">
        <div class="cart-list" id="cart-list">
          ${cart
            .map((c, i) => {
              const item = getItem(c.itemId);
              if (!item) return "";
              const totals = calculateItemTotals(item, c.activeLayerIds);
              const removed = item.layers.filter((l) => l.isBase && !c.activeLayerIds.includes(l.id)).map((l) => l.title);
              const added = item.layers.filter((l) => !l.isBase && c.activeLayerIds.includes(l.id)).map((l) => l.title);
              const customBits = [
                ...removed.map((t) => `− ${t}`),
                ...added.map((t) => `+ ${t}`),
              ];
              return `
            <div class="cart-item">
              <div class="thumb" style="background: color-mix(in oklch, ${item.hue} 25%, var(--bg))">
                <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
                  <g fill="${item.hue}">
                    <rect x="8" y="23" width="18" height="4" rx="2"/>
                    <rect x="8" y="15" width="18" height="5" rx="2" opacity="0.7"/>
                    <rect x="8" y="8" width="18" height="4" rx="2" opacity="0.45"/>
                  </g>
                </svg>
              </div>
              <div>
                <h3>${item.title}</h3>
                <p class="custom">${customBits.length ? customBits.join(" · ") : "Базовый состав"}</p>
                <div class="qty" style="margin-top:8px">
                  <button type="button" data-dec="${i}" aria-label="Убавить">−</button>
                  <span>${c.qty}</span>
                  <button type="button" data-inc="${i}" aria-label="Прибавить">+</button>
                  <button type="button" class="remove" data-remove="${i}">убрать</button>
                </div>
              </div>
              <span class="item-line-price">${fmtPrice(totals.price * c.qty)}</span>
            </div>`;
            })
            .join("")}
        </div>

        <aside class="summary">
          <div class="card">
            <p class="eyebrow" style="margin-bottom: var(--sp-4)">Как получить</p>
            <div class="order-types" role="group" aria-label="Способ получения">
              <button type="button" class="order-type" data-type="pickup" aria-pressed="${orderType === "pickup"}">Самовывоз</button>
              <button type="button" class="order-type" data-type="delivery" aria-pressed="${orderType === "delivery"}">Доставка</button>
              <button type="button" class="order-type" data-type="dinein" aria-pressed="${orderType === "dinein"}" ${hold ? "" : "disabled title='Сначала удержите стол на странице бронирования'"}>К столику${hold ? "" : " (нет стола)"}</button>
            </div>
            ${hold && orderType === "dinein" ? `<p class="muted" style="margin-top:10px;font-size:13px">Стол удержан до конца таймера холда — заказ привяжется к брони.</p>` : ""}
          </div>

          <form class="card form-grid" id="form" novalidate>
            <div class="field" data-name="name">
              <label for="f-name">Имя</label>
              <input id="f-name" name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться">
              <span class="err" aria-live="polite"></span>
            </div>
            <div class="field" data-name="phone">
              <label for="f-phone">Телефон</label>
              <input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="+375 __ ___-__-__">
              <span class="err" aria-live="polite"></span>
            </div>
            <div class="field" data-name="address" ${orderType === "delivery" ? "" : "hidden"}>
              <label for="f-address">Адрес доставки</label>
              <input id="f-address" name="address" type="text" autocomplete="street-address" placeholder="Улица, дом, квартира">
              <span class="err" aria-live="polite"></span>
            </div>

            <div>
              <div class="sum-row"><span class="muted">Позиции</span><span>${fmtPrice(sum)}</span></div>
              <div class="sum-row"><span class="muted">Доставка</span><span>${orderType === "delivery" ? (deliveryFee === 0 ? "бесплатно" : fmtPrice(deliveryFee)) : "—"}</span></div>
              <div class="sum-row total"><span>Итого</span><span>${fmtPrice(sum + deliveryFee)}</span></div>
            </div>
            <button type="submit" class="btn btn-primary">Подтвердить заказ</button>
            <p class="muted" style="font-size:12.5px">В макете заказ сохраняется локально; в бою цену пересчитает API — клиентской цене не доверяем.</p>
          </form>
        </aside>
      </div>`;

    root.querySelectorAll("[data-inc]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.inc; updateQty(i, getCart()[i].qty + 1); render(); }));
    root.querySelectorAll("[data-dec]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.dec; updateQty(i, getCart()[i].qty - 1); render(); }));
    root.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => { removeFromCart(+b.dataset.remove); render(); }));
    root.querySelectorAll(".order-type").forEach((b) =>
      b.addEventListener("click", () => {
        if (b.disabled) return;
        orderType = b.dataset.type;
        render();
      })
    );

    const form = root.querySelector("#form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const name = String(data.get("name") ?? "").trim();
      const phone = String(data.get("phone") ?? "").trim();
      const address = String(data.get("address") ?? "").trim();

      let ok = true;
      const setErr = (n, msg) => {
        const f = form.querySelector(`[data-name="${n}"]`);
        f.dataset.invalid = String(Boolean(msg));
        f.querySelector(".err").textContent = msg;
        if (msg) ok = false;
      };
      setErr("name", name.length >= 2 ? "" : "Введите имя (минимум 2 символа)");
      setErr("phone", /^\+?[\d\s()-]{9,}$/.test(phone) ? "" : "Введите телефон в формате +375…");
      if (orderType === "delivery") setErr("address", address.length >= 6 ? "" : "Укажите адрес доставки");
      if (!ok) return;

      const orderNo = "TC-" + String(Math.floor(1000 + Math.random() * 9000));
      const order = { orderNo, sum: sum + deliveryFee, orderType, name, phone, address, items: getCart(), createdAt: new Date().toISOString() };
      saveLastOrder(order);
      clearCart();

      root.innerHTML = `
        <div class="success">
          <p class="eyebrow" style="justify-content:center">Заказ принят</p>
          <span class="order-no">${orderNo}</span>
          <p class="muted">${name}, спасибо! ${
            orderType === "delivery"
              ? `Курьер привезёт заказ по адресу: ${address}.`
              : orderType === "dinein"
                ? "Заказ привязан к вашей брони — приходите к слоту, всё будет готово."
                : "Заказ будет ждать вас на барной стойке."
          }</p>
          <p class="muted">Итого: <strong>${fmtPrice(order.sum)}</strong></p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
            <a class="btn btn-primary" href="./menu.html">Ещё кофе</a>
            <a class="btn btn-ghost" href="./booking.html">Забронировать стол</a>
          </div>
        </div>`;
    });
  }

  render();
</script>
</body>
</html>
