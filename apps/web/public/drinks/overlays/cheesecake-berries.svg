<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" aria-hidden="true">
  <!-- Mixed berry topping for cheesecake; transparent bg -->
  <defs>
    <radialGradient id="berry" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e85a7a"/>
      <stop offset="55%" stop-color="#b01e45"/>
      <stop offset="100%" stop-color="#6e1028"/>
    </radialGradient>
    <radialGradient id="blue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6b8fd4"/>
      <stop offset="60%" stop-color="#3a4f8a"/>
      <stop offset="100%" stop-color="#1e2a4a"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="170" rx="86" ry="20" fill="#1a0e12" opacity="0.26"/>

  <!-- Raspberries -->
  <g transform="translate(160 120)">
    <circle cx="10" cy="8" r="6.5" fill="url(#berry)"/>
    <circle cx="20" cy="9" r="6.2" fill="url(#berry)"/>
    <circle cx="15" cy="17" r="6.6" fill="url(#berry)"/>
    <circle cx="6" cy="16" r="5.4" fill="#ad1457"/>
    <circle cx="24" cy="15" r="5.5" fill="#c2185b"/>
  </g>
  <g transform="translate(210 118)">
    <circle cx="9" cy="7" r="6" fill="url(#berry)"/>
    <circle cx="18" cy="8" r="5.8" fill="#c2185b"/>
    <circle cx="13" cy="15" r="6.2" fill="url(#berry)"/>
    <circle cx="5" cy="14" r="5" fill="#ad1457"/>
  </g>

  <!-- Blueberries -->
  <circle cx="152" cy="148" r="7.5" fill="url(#blue)"/>
  <circle cx="154" cy="145" r="1.6" fill="#9bb4e8" opacity="0.45"/>
  <circle cx="188" cy="144" r="7" fill="url(#blue)"/>
  <circle cx="190" cy="141" r="1.4" fill="#9bb4e8" opacity="0.4"/>
  <circle cx="224" cy="150" r="6.8" fill="url(#blue)"/>
  <circle cx="226" cy="147" r="1.3" fill="#9bb4e8" opacity="0.4"/>
  <circle cx="246" cy="136" r="6.2" fill="url(#blue)"/>

  <!-- Small raspberry cluster -->
  <g transform="translate(172 150)" opacity="0.95">
    <circle cx="7" cy="6" r="4.8" fill="url(#berry)"/>
    <circle cx="14" cy="7" r="4.6" fill="#c2185b"/>
    <circle cx="10" cy="13" r="5" fill="url(#berry)"/>
  </g>
</svg>
